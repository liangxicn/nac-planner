<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAC · 布线工作台</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><div class="brand"><span class="brand-icon">N</span><div><b>NAC <span>布线工作台</span></b><small>NANOCHIP ASSEMBLY COMPLEX</small></div></div><div class="header-actions"><span id="save-status">本地自动保存</span><button id="import-btn">导入方案</button><button id="export-btn">导出方案 ↗</button></div></header>
<main>
<aside class="left-panel"><div class="stats"><div><strong id="module-count">0<span>/12</span></strong><small>已放置模块</small></div></div><div class="section-heading">已添加模块 <span id="list-count">00</span></div><div id="module-list" class="module-list"></div><div class="guide"><div class="section-heading">操作说明</div><p><kbd>左键</kbd> 空槽位添加 · 模块选中</p><p><kbd>再点</kbd> 点模块连线 · 控制室点接口</p><p><kbd>拖动</kbd> 模块换位 · 模块接口与折线</p><p><kbd>右键</kbd> 取消选中 · 未选中时替换</p><p><kbd>Esc</kbd> 取消选中 <kbd>Del</kbd> 删除</p></div><a class="source" href="https://wiki.gtnewhorizons.com/wiki/Nanochip_Assembly_Complex" target="_blank" rel="noreferrer">GTNH Wiki · 参考资料 ↗</a></aside>
<section class="workspace"><div class="toolbar"><div><span class="live-dot"></span><b>布局画布</b><span class="pill">俯视 · 双层</span></div><div class="tools"><label class="snap-toggle" title="手动拖动时，靠近的平行线段吸附对齐"><input type="checkbox" id="parallel-snap" checked>平行吸附</label><span class="divider"></span><button id="undo" title="撤销 Ctrl+Z">↶</button><button id="redo" title="重做 Ctrl+Shift+Z">↷</button><span class="divider"></span><button id="zoom-out" title="缩小">−</button><button id="fit" title="适应画布">100%</button><button id="zoom-in" title="放大">＋</button><span class="divider"></span><button id="reset-layout" title="清空模块和线路，恢复初始视图；可撤销">重置</button></div></div><div id="canvas-wrap"><svg id="canvas" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1040" aria-label="NAC 模块布局与连线画布"><defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#c3c6ca"/></pattern></defs><rect x="-10000" y="-10000" width="20000" height="20000" fill="url(#dots)"/><g id="ground"></g><g id="nodes"></g><g id="wires"></g><g id="sockets"></g><g id="handles"></g><g id="ghost"></g></svg><div id="toast" role="status"></div></div><div class="mode-bar" role="group" aria-label="画布模式"><button id="mode-view" aria-pressed="false">查看模式</button><button id="mode-connect" aria-pressed="true">连线模式</button><span class="divider"></span><div class="layer-switch" role="group" aria-label="布线层"><button id="layer-one" aria-pressed="true">第一层</button><button id="layer-two" aria-pressed="false">第二层</button></div></div></section>
<aside class="right-panel"><div id="inspector"></div><div class="line-section"><div class="section-heading">线路 <span id="wire-list-count">00</span></div><div id="wire-list"></div></div></aside>
</main><dialog id="picker"><div class="dialog-head"><div><div class="eyebrow">MODULE LIBRARY</div><h2 id="picker-title">添加模块</h2></div><button id="close-picker" aria-label="关闭">×</button></div><label id="keep-wrap"><input type="checkbox" id="keep-lines" checked> 保留现有线路（包括自连线）</label><div id="choices"></div><p class="dialog-foot">同类模块可重复放置 · 组装矩阵同样占用外围槽位</p></dialog><input id="import-file" type="file" accept=".json,application/json" hidden>

<script src="recipe-data.js"></script><script src="recipe-ui.js"></script><script src="app.js"></script></body></html>
